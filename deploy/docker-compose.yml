services:
  db:
    # DOCKER_REGISTRY_MIRROR (e.g. docker.m.daocloud.io) set in .env for CN networks
    image: ${DOCKER_REGISTRY_MIRROR:-docker.io}/pgvector/pgvector:pg16
    container_name: mqa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chinook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinook123}
      POSTGRES_DB: ${POSTGRES_DB:-chinook}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chinook} -d ${POSTGRES_DB:-chinook}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
      args:
        REGISTRY: ${DOCKER_REGISTRY_MIRROR:-docker.io}
    container_name: mqa-backend
    depends_on:
      db:
        condition: service_healthy
    # run as host uid so mounted dirs keep host ownership
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-chinook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinook123}
      POSTGRES_DB: ${POSTGRES_DB:-chinook}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LLM_RESPONSE_CACHE: ${LLM_RESPONSE_CACHE:-1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-models/bge-small-zh-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      SILICONFLOW_EMBEDDING_MODEL: ${SILICONFLOW_EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANK_ENABLED: ${RERANK_ENABLED:-0}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-local}
      RERANK_MODEL_PATH: ${RERANK_MODEL_PATH:-models/bge-reranker-v2-m3}
      RERANK_DEVICE: ${RERANK_DEVICE:-cpu}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      RERANK_CANDIDATE_K: ${RERANK_CANDIDATE_K:-20}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-512}
      RAG_FACTCHECK_ENABLED: ${RAG_FACTCHECK_ENABLED:-0}
      RAG_FACTCHECK_MAX_ROUNDS: ${RAG_FACTCHECK_MAX_ROUNDS:-2}
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-0}
      RAG_HYDE_ENABLED: ${RAG_HYDE_ENABLED:-0}
      RAG_QUERY_REWRITE_HISTORY_LIMIT: ${RAG_QUERY_REWRITE_HISTORY_LIMIT:-6}
      FORMULA_EXTRACT_ENABLED: ${FORMULA_EXTRACT_ENABLED:-0}
      FORMULA_EXTRACT_MAX_BLOCKS: ${FORMULA_EXTRACT_MAX_BLOCKS:-40}
      FORMULA_EXTRACT_MAX_FORMULAS: ${FORMULA_EXTRACT_MAX_FORMULAS:-20}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../data:/app/data
      - ../models:/app/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      args:
        REGISTRY: ${DOCKER_REGISTRY_MIRROR:-docker.io}
    container_name: mqa-frontend
    depends_on:
      - backend
    # bypass docker-entrypoint.d (its apk/ipv6 probes hang on restricted networks)
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "8090:80"

volumes:
  pgdata:
